<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astro Smash Arcade</title>
    <script>
      // Shield against third-party browser extensions (MetaMask, Coinbase Wallet, etc.)
      // attempting to redefine window.ethereum and throwing uncaught TypeErrors.
      (function() {
        try {
          var _eth = window.ethereum;
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function() { return _eth; },
            set: function(v) { _eth = v; }
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (e.message && e.message.indexOf('ethereum') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
